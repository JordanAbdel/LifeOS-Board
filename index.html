<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>LifeOS</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#1a1814" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LifeOS" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ─── tokens ─── */
/* --muted-2 is now a non-text token only (the hero dot, the stalled progress
   fill). Every text tier that used it failed WCAG AA, and the minimum passing
   value turned out to be --muted itself, so the third text tier collapsed. */
:root {
  --bg: #faf7f2; --surface: #ffffff; --surface-2: #f4efe5;
  /* --muted/-2 are darker than they look "designed" because the light palette
     has to clear WCAG AA 4.5:1 against all three light surfaces (#ffffff,
     #faf7f2, #f4efe5). The previous #8a8377/#b8b1a3 measured 3.5–3.8 and
     2.0–2.1 respectively. Dark theme already passes and is unchanged. */
  --ink: #1a1814; --ink-2: #3a342c; --muted: #6f6a5e; --muted-2: #8a8377;
  --line: #ebe5d6; --line-2: #e0d9c7;
  --accent: #c96442; --accent-soft: #f4e3d8; --accent-ink: #7a3a22;
  --warn: #b44d28; --warn-soft: #f7dccb;
  --ok: #5f7a4a; --ok-soft: #e6ead9;
  --font-serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --font-sans:  "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:  "Geist Mono", ui-monospace, monospace;
  --radius-sm: 8px; --radius: 14px; --radius-lg: 20px;
}
[data-theme="dark"] {
  --bg: #1a1814; --surface: #221f1a; --surface-2: #2a2620;
  --ink: #f5f1e8; --ink-2: #d8d2c4; --muted: #948c7e; --muted-2: #6b6458;
  --line: #2f2b25; --line-2: #3a352d;
  --accent: #d97757; --accent-soft: #3a261d; --accent-ink: #efc1a8;
  --warn: #d96a3e; --warn-soft: #3d1f12;
  --ok: #8aa674; --ok-soft: #232a1d;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background .35s ease, color .35s ease;
}
* { min-width: 0; box-sizing: border-box; }  /* stops flex/grid children forcing overflow */
button { font-family: inherit; cursor: pointer; }
input, textarea, button, select { color: inherit; }
input:focus, textarea:focus, select:focus { outline: none; }
::selection { background: var(--accent-soft); color: var(--accent-ink); }

/* ─── shell ─── */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh;
  border-right: 1px solid var(--line); background: var(--bg);
  display: flex; flex-direction: column; padding: 28px 18px 20px;
  transition: background .35s ease, border-color .35s ease;
}
.brand { display: flex; align-items: baseline; gap: 8px; padding: 0 8px 24px; }
.brand-mark { font-family: var(--font-serif); font-size: 22px; letter-spacing: -0.02em; color: var(--ink); }
.brand-mark em { color: var(--accent); font-style: italic; font-weight: 400; }
.brand-sub { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.brand-version {
  font-family: var(--font-mono); font-size: 10px; color: var(--muted);
  letter-spacing: 0.04em; margin-top: 2px;
}
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-eyebrow {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); padding: 14px 10px 8px;
}
.nav-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  color: var(--ink-2); padding: 9px 10px; border-radius: 8px;
  font-size: 13px; border: 0; background: transparent; text-align: left; width: 100%;
  transition: background .15s ease, color .15s ease;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--surface-2); color: var(--ink); }
.nav-item .count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-spacer { flex: 1; }
.sidebar-foot { display: flex; flex-direction: column; gap: 8px; }
.theme-toggle {
  border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  padding: 8px 12px; border-radius: 999px; font-size: 12px;
  display: flex; align-items: center; gap: 8px;
  transition: border-color .15s ease, background .15s ease, color .15s ease;
}
.theme-toggle:hover { border-color: var(--line-2); background: var(--surface-2); color: var(--ink); }

/* ─── main ─── */
main { padding: 32px 48px 80px; max-width: 1240px; }
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  flex-wrap: wrap; gap: 24px 32px; margin-bottom: 28px;
}
.page-head > :first-child { flex: 1 1 420px; min-width: 0; }
.page-head > .capture { flex: 0 1 460px; }
.hero { font-family: var(--font-serif); font-size: 36px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 400; margin: 0 0 6px; }
.hero em { font-style: italic; color: var(--accent); }
.hero-meta { font-size: 13px; color: var(--muted); }
.hero-meta .dot { display: inline-block; width: 4px; height: 4px; border-radius: 999px; background: var(--muted-2); margin: 0 8px; vertical-align: middle; }

/* ─── capture ─── */
.capture {
  display: flex; align-items: stretch; gap: 0;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); overflow: hidden;
  min-width: 0; width: 100%; max-width: 520px;
  transition: border-color .15s ease;
}
.capture:focus-within { border-color: var(--accent); }
.capture .cap-icon { display: flex; align-items: center; padding: 0 6px 0 16px; color: var(--muted); }
.capture input { flex: 1; border: 0; background: transparent; padding: 10px 12px; font-size: 13px; min-width: 0; }
.capture input::placeholder { color: var(--muted); }
.capture select {
  border: 0; background: transparent;
  border-left: 1px solid var(--line); padding: 0 12px;
  font-size: 12px; color: var(--muted);
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 50%, calc(100% - 10px) 50%;
  background-size: 4px 4px, 4px 4px; background-repeat: no-repeat;
  padding-right: 28px;
}
.capture select option { background: var(--surface); color: var(--ink); }
.capture .cap-submit {
  border: 0; background: var(--ink); color: var(--bg);
  padding: 0 18px; font-size: 13px; font-weight: 500;
  transition: background .15s ease;
}
.capture .cap-submit:hover { background: var(--accent); color: #fff; }

/* ─── section ─── */
section.block { margin-bottom: 44px; }
.eyebrow {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 8px; display: flex; align-items: baseline; gap: 12px;
}
.eyebrow .eyebrow-meta { color: var(--muted); letter-spacing: 0; text-transform: none; font-family: var(--font-mono); font-size: 11px; }
.section-title { font-family: var(--font-serif); font-size: 19px; letter-spacing: -0.01em; font-weight: 500; margin: 0 0 16px; }
.section-title em { font-style: italic; color: var(--accent); font-weight: 400; }

/* ─── card ─── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); transition: border-color .15s ease, background .35s ease; }
.card.lift { transition: border-color .15s ease, transform .1s ease, background .35s ease; }
.card.lift:hover { border-color: var(--line-2); transform: translateY(-1px); }

/* ─── priority queue ─── */
.pq { padding: 6px 20px; }
.pq ol { list-style: none; margin: 0; padding: 0; }
.pq li {
  display: grid;
  grid-template-columns: 28px 100px 1fr 100px 120px 90px;
  gap: 12px; align-items: center;
  padding: 12px 10px; margin: 0 -10px;
  border-top: 1px solid var(--line);
  border-radius: 10px; font-size: 13.5px;
}
.pq li:first-child { border-top: 0; }
.pq li.overdue { background: linear-gradient(90deg, var(--warn-soft) 0%, transparent 80%); }
.pq li.overdue + li { border-top-color: transparent; }
.pq li.blocked .pq-title { color: var(--muted); }
.pq .rank { font-family: var(--font-mono); color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.pq-pill {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; width: max-content;
}
.pq-pill.over { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.pq-pill.due  { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }
.pq-pill.blk  { color: var(--muted); border-style: dashed; }
.pq-title { color: var(--ink); }
.pq-source { font-size: 11px; color: var(--muted); font-family: var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; }
.pq-age { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pq-due { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.pq-due.over { color: var(--warn); }

/* ─── task hub ─── */
.hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.task-col { padding: 18px 18px 8px; }
.task-col-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; gap: 12px; }
.task-col h3 { margin: 0; font-family: var(--font-serif); font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
.task-col .col-meta { font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.filter-chips.wide { margin-bottom: 18px; }
.filter-chips.scroll { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
.filter-chips.scroll::-webkit-scrollbar { display: none; }
.filter-chips.scroll .chip { flex-shrink: 0; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  border-radius: 999px; padding: 5px 12px; font-size: 12px;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.chip:hover { border-color: var(--line-2); }
.chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-count { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.6; margin-left: 4px; }

.task-list { list-style: none; margin: 8px 0 0; padding: 0; }
.task { border-top: 1px solid var(--line); transition: opacity .25s ease, background .35s ease; }
.task:first-child { border-top: 0; }
.task.done { opacity: 0.55; }
.task.done .task-title { text-decoration: line-through; color: var(--muted); }
.task.flash > .task-main { animation: flash .6s ease; }
.task.open { background: var(--surface-2); }
.task.empty-row { color: var(--muted); font-style: italic; padding: 14px 4px; font-size: 13px; }
.done-bin { margin-top: 10px; border-top: 1px solid var(--line); }
.done-bin-toggle {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: none; border: 0; cursor: pointer; padding: 11px 4px;
  color: var(--muted); font-family: inherit; font-size: 12px;
  letter-spacing: .04em; text-transform: uppercase; transition: color .15s ease;
}
.done-bin-toggle:hover { color: var(--ink); }
.done-bin-toggle .done-bin-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--surface-2); color: var(--muted); font-size: 11px;
  font-family: var(--font-mono); letter-spacing: 0;
}
.done-bin-toggle .chev { margin-left: auto; }
.task-main {
  display: grid; grid-template-columns: 22px 1fr auto auto 14px;
  gap: 12px; align-items: center; padding: 11px 4px;
  cursor: pointer; transition: background .15s ease;
}
.task-main:hover { background: var(--surface-2); }
.task-chev {
  color: var(--muted); display: flex; align-items: center; justify-content: center;
  background: transparent; border: 0; padding: 0; border-radius: 999px;
  transition: color .15s ease;
}
.task-chev:hover { color: var(--ink); }
.task-chev:focus-visible, .check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }

.check {
  width: 18px; height: 18px; border-radius: 999px;
  border: 1.5px solid var(--line-2); background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  transition: border-color .15s ease, background .25s ease; padding: 0;
}
.check:hover { border-color: var(--ink); }
.check.checked { background: var(--ok); border-color: var(--ok); }
.check svg { width: 11px; height: 11px; opacity: 0; transition: opacity .25s ease; color: var(--bg); }
.check.checked svg { opacity: 1; }

.task-body { min-width: 0; }
.task-title { color: var(--ink); font-size: 13.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.task-sub { color: var(--muted); font-size: 11.5px; margin-top: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.note-snip { font-family: var(--font-mono); letter-spacing: 0.02em; color: var(--muted); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.age-snip { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.inline-pill { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--warn-soft); color: var(--ink-2); border: 1px solid var(--warn); }

.pri { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--muted); }
.pri.high { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.pri.med  { color: var(--ink-2); border-color: var(--line-2); }
.pri.low  { color: var(--muted); border-color: var(--line); }
.due { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.due.over { color: var(--warn); }
.due.soon { color: var(--accent); }

/* ─── today panels (calendar · email) ─── */
.panel { padding: 18px 18px 16px; display: flex; flex-direction: column; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.panel-head h3 { margin: 0; font-family: var(--font-serif); font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
.panel-meta { font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* state notes — one shared shape so free day / stale / error stay siblings, not specials */
.panel-note { display: flex; align-items: flex-start; gap: 10px; padding: 14px 4px; font-size: 13px; color: var(--muted); }
.panel-note .panel-note-ico { flex-shrink: 0; margin-top: 1px; color: var(--muted-2); }
.panel-note-body { min-width: 0; }
.panel-note-title { color: var(--ink-2); }
.panel-note-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.panel-note.warn { color: var(--warn); }
.panel-note.warn .panel-note-ico { color: var(--warn); }
.panel-note.warn .panel-note-title { color: var(--warn); }
.panel-note.quiet .panel-note-title { font-family: var(--font-serif); font-size: 15px; font-style: italic; color: var(--muted); }

/* stale sync — deliberately louder than an empty day (Task 8) */
.stale-banner {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--warn); background: var(--warn-soft);
  /* Body text is --ink-2, not --warn: warn-on-warn-soft measures 4.33:1, under
     the 4.5:1 AA floor for text this size. The warning still reads through the
     border, fill and icon, so the signal never depends on the text colour. */
  color: var(--ink-2);
  border-radius: var(--radius-sm); padding: 8px 11px;
  font-size: 12px; margin-bottom: 10px;
}
.stale-banner svg { color: var(--warn); flex-shrink: 0; }
.stale-banner .stale-age { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* event list */
.ev-list { list-style: none; margin: 0; padding: 0; }
.ev { display: grid; grid-template-columns: 62px 1fr auto; gap: 12px; align-items: baseline;
      padding: 10px 4px; border-top: 1px solid var(--line); }
.ev:first-child { border-top: 0; }
.ev.now { background: linear-gradient(90deg, var(--accent-soft) 0%, transparent 80%); border-radius: 8px; margin: 0 -4px; padding: 10px 8px; }
.ev-time { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ev-time.all-day { color: var(--muted); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
.ev-body { min-width: 0; }
.ev-title { display: block; font-size: 13.5px; color: var(--ink); }
.ev-loc { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-src { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
          color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; white-space: nowrap; }
.ev-src.work { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }

/* email triage — two items, reason line is the point */
.mail-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.mail { display: block; border-top: 1px solid var(--line); padding: 12px 4px; text-decoration: none; color: inherit; border-radius: 8px; transition: background .15s ease; }
.mail:first-child { border-top: 0; }
.mail:hover { background: var(--surface-2); }
.mail:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.mail-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.mail-from { font-size: 13px; color: var(--ink); }
.mail-age { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.mail-subj { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-why { display: block; font-family: var(--font-serif); font-style: italic; font-size: 13px; color: var(--ink-2); margin-top: 6px; line-height: 1.45; text-wrap: pretty; }

/* skeletons — content-shaped, not a spinner (panels load independently of tasks) */
.skel { background: var(--surface-2); border-radius: 6px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.skel-row { display: grid; grid-template-columns: 62px 1fr; gap: 12px; padding: 11px 4px; border-top: 1px solid var(--line); }
.skel-row:first-child { border-top: 0; }
.skel-line { height: 10px; }

/* ─── research ─── */
.research-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
.rcard { padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 220px; }
.rcard.editing { background: var(--surface-2); }
.rcard-note { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; text-wrap: pretty; border-top: 1px dashed var(--line); padding-top: 10px; }
.rcard-note.muted { color: var(--muted); font-style: italic; }
.rcard-foot { display: flex; justify-content: flex-end; margin-top: auto; }
.rcard-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.rcard-name { font-family: var(--font-serif); font-size: 17px; line-height: 1.25; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); margin: 0; }
.status-pill { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.status-pill.active   { color: var(--ok);   border-color: var(--ok);   background: var(--ok-soft); }
.status-pill.stalled  { color: var(--warn);  border-color: var(--warn);  background: var(--warn-soft); }
.status-pill.complete { color: var(--muted); border-color: var(--line); }
.progress-row { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 4px; border-radius: 999px; background: var(--surface-2); overflow: hidden; position: relative; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); transition: width .6s cubic-bezier(.4,0,.2,1); }
.bar-fill.complete { background: var(--ok); }
.bar-fill.stalled  { background: var(--muted-2); }
.rcard-meta { font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); letter-spacing: 0.02em; }
.rcard-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); letter-spacing: 0.02em; }

/* ─── editor (shared) ─── */
.editor { padding: 6px 4px 14px; display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--line); margin-top: 0; animation: edopen .25s ease; }
@keyframes edopen { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.ed-row { display: flex; flex-direction: column; gap: 5px; }
.ed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ed-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.ed-meta  { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.ed-input { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--ink); font-family: var(--font-sans); transition: border-color .15s ease; resize: vertical; }
.ed-input.inline { padding: 6px 10px; flex: 1; }
.ed-input:focus { border-color: var(--accent); }
.ed-input[type="date"] { font-family: var(--font-mono); font-size: 12px; }
.ed-input::placeholder { color: var(--muted); }
.seg { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.seg-btn { background: transparent; border: 1px solid var(--line); color: var(--ink-2); border-radius: 999px; padding: 5px 12px; font-size: 12px; transition: border-color .15s ease, background .15s ease, color .15s ease; }
.seg-btn:hover { border-color: var(--line-2); }
.seg-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.range-row { display: flex; align-items: center; gap: 12px; }
.range-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.range-val { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; width: 38px; text-align: right; }
.tag-picker { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-btn { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 10px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em; transition: all .15s ease; }
.tag-btn:hover { color: var(--ink); border-color: var(--line-2); }
.tag-btn.on { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
.tag.editable { cursor: pointer; user-select: none; }
.tag.editable:hover { color: var(--warn); border-color: var(--warn); }
.tag-input { background: transparent; border: 1px dashed var(--line); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-family: var(--font-mono); color: var(--ink); min-width: 90px; }
.tag-input:focus { border-style: solid; border-color: var(--accent); }
.ed-actions { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.ed-actions .spacer { flex: 1; }

/* ─── buttons ─── */
.btn-ink { background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 7px 16px; font-size: 12.5px; font-weight: 500; transition: background .15s ease; }
.btn-ink:hover { background: var(--accent); color: #fff; }
.btn-ink:disabled { opacity: 0.5; cursor: not-allowed; }
.ghost { background: transparent; border: 0; color: var(--muted); font-size: 12px; padding: 4px 8px; border-radius: 999px; transition: color .15s ease, background .15s ease; }
.ghost:hover { color: var(--ink); background: var(--surface-2); }
.ghost.danger { color: var(--warn); display: inline-flex; align-items: center; gap: 6px; }
.ghost.danger:hover { background: var(--warn-soft); color: var(--warn); }
.empty { padding: 28px 20px; color: var(--muted); font-family: var(--font-serif); font-size: 16px; font-style: italic; }

/* ─── loading / error ─── */
.loading-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; gap: 16px; color: var(--muted);
}
.spinner {
  width: 24px; height: 24px; border: 2px solid var(--line);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-banner {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--warn-soft); border: 1px solid var(--warn); border-radius: var(--radius);
  padding: 12px 20px; font-size: 13px; color: var(--ink-2); z-index: 100;
  display: flex; align-items: center; gap: 12px;
  animation: slideUp .25s ease;
}
/* Same reason as .stale-banner: --warn on --warn-soft measures 4.0-4.3:1, under
   the AA floor. The icon and border carry the warning; the text stays legible. */
.error-banner svg { color: var(--warn); flex-shrink: 0; }
@keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ─── auth gate ─── */
.auth-card { display: flex; flex-direction: column; gap: 10px; padding: 28px; width: min(340px, calc(100vw - 48px)); }
.auth-card .brand-sub { margin-bottom: 8px; }
.auth-card .btn-ink { margin-top: 6px; }
.auth-err { font-size: 12.5px; color: var(--warn); }


/* ─── responsive ─── */
@media (max-width: 1100px) {
  .research-grid { grid-template-columns: repeat(2, 1fr); }
  .pq li { grid-template-columns: 24px 90px 1fr 80px 90px; }
}

/* Tablet + large phones */
@media (max-width: 820px) {
  :root { --nav-h: 52px; }            /* height of the fixed mobile nav */

  .app { grid-template-columns: 1fr; overflow-x: hidden; }

  /* Fixed nav — guaranteed flush with top, no sticky/overflow interaction */
  .sidebar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    height: var(--nav-h);
    flex-direction: row; align-items: center;

    border-right: 0; border-bottom: 1px solid var(--line);

  }
  /* PWA only: push nav below the translucent status bar */
  @media (display-mode: standalone) {
    :root { --nav-h: calc(52px + env(safe-area-inset-top)); }
    .sidebar { padding-top: env(safe-area-inset-top); }
  }

  .brand-sub, .brand-version { display: none; }
  .brand { padding: 0 12px 0 0; border-right: 1px solid var(--line); margin-right: 8px; flex-shrink: 0; }
  .nav { flex-direction: row; gap: 6px; flex-wrap: nowrap; }
  .nav-eyebrow { display: none; }
  .nav-spacer { display: none; }
  .nav-item { width: auto; justify-content: flex-start; gap: 6px; padding: 7px 12px; font-size: 13px; }
  .nav-item .count { background: var(--line); border-radius: 999px; padding: 1px 6px; min-width: 18px; text-align: center; font-size: 11px; line-height: 1.5; }
  .nav-item.active .count { background: var(--line-2); }
  .sidebar-foot { margin-left: auto; }
  .theme-toggle span { display: none; }

  /* Offset main below the fixed nav */
  main {
    padding-top: calc(var(--nav-h) + 20px);
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: max(100px, calc(80px + env(safe-area-inset-bottom)));
  }

  .hub-grid { grid-template-columns: 1fr; }
  .research-grid { grid-template-columns: 1fr; }
  .page-head { flex-direction: column; align-items: stretch; gap: 12px; }
  .page-head > :first-child { flex: 0 0 auto; }
  .page-head > .capture { flex: 0 0 auto; }
  .hero { font-size: 26px; }
  .pq li { grid-template-columns: 20px 1fr; grid-template-rows: auto auto; gap: 4px 10px; }
  .pq .rank { grid-row: 1; }
  .pq-pill { display: none; }
  .pq-title { grid-column: 2; grid-row: 1; }
  .pq-source { grid-column: 2; grid-row: 2; }
  .pq-age, .pq-due { display: none; }
}

/* Small phones — iPhone SE (375px) through iPhone 15 Pro Max (430px) */
@media (max-width: 430px) {
  .hero { font-size: 22px; line-height: 1.2; }
  .section-title { font-size: 17px; }
  .task-main { grid-template-columns: 22px 1fr auto 14px; gap: 8px; }
  .due { display: none; }
  .filter-chips { gap: 4px; }
  .chip { padding: 5px 9px; font-size: 11px; }
  .ed-grid { grid-template-columns: 1fr; }
  .rcard { padding: 14px 14px 10px; }
  .rcard-name { font-size: 15px; }
  .task-col { padding: 14px 14px 6px; }
  .panel { padding: 14px 14px 12px; }
  /* source pill drops to its own line rather than squeezing the title */
  .ev { grid-template-columns: 54px 1fr; grid-template-rows: auto auto; gap: 2px 10px; }
  .ev-src { grid-column: 2; justify-self: start; margin-top: 4px; }
  .pq { padding: 4px 12px; }
  .pq li { padding: 10px 6px; }

  /* Compress capture bar so it fits on narrow screens */
  .capture input { font-size: 12px; padding: 9px 8px; }
  .capture select { padding: 0 18px 0 6px; font-size: 11px; background-position: calc(100% - 8px) 50%, calc(100% - 4px) 50%; }
  .capture .cap-submit { padding: 0 12px; font-size: 12px; }
  .capture .cap-icon { padding: 0 4px 0 10px; }
}

<div id="root"></div>

<script type="text/babel">
/* ── LifeOS v1.3.0 ── */

const { useState, useEffect, useMemo, useRef, useCallback } = React;
const VERSION = "v1.3.0";

const SUPABASE_URL = "https://eefycklvsmuqhdckymmw.supabase.co";
const SUPABASE_KEY = "sb_publishable_FMQM5VuVnpCB2Uy3JR0Hwg_F27EuqfM";
const THEME_KEY    = "ld-theme";
const WORK_TAGS   = ["tech-viz","pipeline","vendor","review","hiring","bug","color"];

/* Decision D4's "small known-sender list". A name or address matching any entry
   gets the single largest boost in the ranking, so keep this to people whose
   mail genuinely should interrupt a morning — it stops being a signal the moment
   it becomes a contact list. Matching is substring, case-insensitive, against
   both the display name and the address. Safe to leave empty: every other signal
   still works. */
const KNOWN_SENDERS = [];


/* ─────────────── date helpers ─────────────── */

function todayUTC() {
  const d = new Date();
  return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
}

function daysFrom(dateStr) {
  if (!dateStr) return null;
  const t = todayUTC();
  const d = new Date(dateStr.slice(0, 10) + "T00:00:00Z");
  return Math.round((d - t) / 86400000);
}

function daysAgo(isoStr) {
  if (!isoStr) return null;
  const t = todayUTC();
  const d = new Date(isoStr.slice(0, 10) + "T00:00:00Z");
  return Math.round((t - d) / 86400000);
}

function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d.slice(0, 10) + "T00:00:00Z");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[dt.getUTCMonth()]} ${dt.getUTCDate()}`;
}

function relDue(d) {
  const n = daysFrom(d);
  if (n === null) return "—";
  if (n < 0)  return `${Math.abs(n)}d overdue`;
  if (n === 0) return "today";
  if (n === 1) return "tomorrow";
  if (n < 7)  return `in ${n}d`;
  return fmtDate(d);
}

function relAgo(isoStr) {
  const n = daysAgo(isoStr);
  if (n === null) return "—";
  if (n <= 0) return "today";
  if (n === 1) return "yesterday";
  if (n < 30) return `${n}d ago`;
  if (n < 365) return `${Math.floor(n / 30)}mo ago`;
  return `${Math.floor(n / 365)}y ago`;
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 17) return "Good afternoon";
  return "Good evening";
}

function getTodayLabel() {
  const d = new Date();
  const days   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

const isoToday = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};

/* db row → js object */
function toTask(row) {
  return {
    id: row.id, kind: row.kind, title: row.title,
    pri: row.pri, due: row.due,
    done: row.done, tags: row.tags || [],
    note: row.note || "", blocked: row.blocked || false,
    blockedBy: row.blocked_by || "",
    createdAt: row.created_at, updatedAt: row.updated_at,
  };
}
function toWorkEvent(row) {
  const now = Date.now();
  const start = new Date(row.starts_at).getTime();
  const end   = row.ends_at ? new Date(row.ends_at).getTime() : null;
  return {
    id: row.id, title: row.title,
    startsAt: row.starts_at, allDay: row.all_day,
    location: row.location || "", source: "work",
    now: !row.all_day && start <= now && (end === null || now < end),
  };
}
function toResearch(row) {
  return {
    id: row.id, name: row.name, status: row.status,
    progress: row.progress, tags: row.tags || [],
    note: row.note || "",
    createdAt: row.created_at, updatedAt: row.updated_at,
  };
}

/* ─────────────── tiny icons ─────────────── */
const IconPlus  = (p) => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" {...p}><path d="M12 5v14M5 12h14" /></svg>);
const IconMoon  = (p) => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" /></svg>);
const IconSun   = (p) => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" {...p}><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>);
const IconTrash = (p) => (<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /></svg>);
const IconChev  = (p) => (<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M6 9l6 6 6-6" /></svg>);
const IconExit  = (p) => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></svg>);
const IconDisc  = (p) => (<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" {...p}><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="3" /></svg>);
const IconCal   = (p) => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>);
const IconMail  = (p) => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></svg>);
const IconAlert = (p) => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /></svg>);
const IconPlug  = (p) => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0V8ZM12 17v5" /></svg>);

const Check = ({ on, onClick, ariaLabel }) => (
  <button className={`check ${on ? "checked" : ""}`} aria-label={ariaLabel} aria-pressed={on}
    onClick={(e) => { e.stopPropagation(); onClick(); }}>
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M2.5 6.2 L5 8.6 L9.5 3.5" />
    </svg>
  </button>
);


/* ─────────────── sidebar ─────────────── */

function Sidebar({ theme, onToggleTheme, view, setView, counts, onSignOut }) {
  return (
    <aside className="sidebar">
      <div className="brand">
        <div>
          <div className="brand-mark">LifeOS<em>.</em></div>
          <div className="brand-sub">Jordan · personal OS</div>
          <div className="brand-version">{VERSION}</div>
        </div>
      </div>
      <nav className="nav" aria-label="Sections">
        <div className="nav-eyebrow">Workspace</div>
        <button className={`nav-item ${view === "today" ? "active" : ""}`} aria-current={view === "today" ? "page" : undefined} onClick={() => setView("today")}>
          <span>Today</span>
          <span className="count">{counts.priority}</span>
        </button>
        <button className={`nav-item ${view === "research" ? "active" : ""}`} aria-current={view === "research" ? "page" : undefined} onClick={() => setView("research")}>
          <span>Research</span>
          <span className="count">{counts.research}</span>
        </button>
      </nav>
      <div className="nav-spacer" />
      <div className="sidebar-foot">
        <button className="theme-toggle" onClick={onToggleTheme} aria-label="Toggle theme">
          {theme === "dark" ? <IconSun /> : <IconMoon />}
          <span>{theme === "dark" ? "Light paper" : "Quiet dark"}</span>
        </button>
        <button className="theme-toggle" onClick={onSignOut} aria-label="Sign out">
          <IconExit />
          <span>Sign out</span>
        </button>
      </div>
    </aside>
  );
}

/* ─────────────── quick capture ─────────────── */

function QuickCapture({ onAdd, defaultBucket = "personal" }) {
  const [text, setText]     = useState("");
  const [bucket, setBucket] = useState(defaultBucket);
  const [busy, setBusy]     = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        inputRef.current && inputRef.current.focus();
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  async function submit(e) {
    e.preventDefault();
    const t = text.trim();
    if (!t || busy) return;
    setBusy(true);
    await onAdd(bucket, t);
    setText("");
    setBusy(false);
  }

  return (
    <form className="capture" onSubmit={submit}>
      <span className="cap-icon" aria-hidden><IconPlus /></span>
      <input ref={inputRef} type="text" value={text} onChange={(e) => setText(e.target.value)}
        placeholder="Capture a thought — ⌘K" aria-label="Quick capture" />
      <select value={bucket} onChange={(e) => setBucket(e.target.value)} aria-label="Destination">
        <option value="personal">→ Personal</option>
        <option value="work">→ Work</option>
        <option value="research">→ Research</option>
      </select>
      <button type="submit" className="cap-submit" disabled={busy}>{busy ? "…" : "Capture"}</button>
    </form>
  );
}

/* ─────────────── priority queue ─────────────── */

function PriorityQueue({ items }) {
  if (items.length === 0) {
    return (
      <section className="block">
        <h2 className="section-title">Priority <em>queue</em></h2>
        <div className="card empty">Beautifully empty. Nothing urgent today.</div>
      </section>
    );
  }
  return (
    <section className="block">
      <div className="eyebrow">
        <span>What needs you most</span>
        <span className="eyebrow-meta">{items.length} live · ordered by urgency</span>
      </div>
      <h2 className="section-title">Priority <em>queue</em></h2>
      <div className="card pq">
        <ol>
          {items.map((it, i) => {
            const d = daysFrom(it.due);
            const isOver    = d !== null && d < 0;
            const isSoon    = d !== null && d >= 0 && d <= 2;
            const isBlocked = it.flag === "blocked";
            const klass    = isBlocked ? "blocked" : (isOver ? "overdue" : "");
            const pillKls  = isBlocked ? "blk" : (isOver ? "over" : (isSoon ? "due" : ""));
            const pillLbl  = isBlocked ? "Blocked" : (isOver ? "Overdue" : (isSoon ? "Due soon" : "Queued"));
            const ageLabel = it.createdAt ? `open ${relAgo(it.createdAt)}` : "";
            return (
              <li key={it.id} className={klass}>
                <span className="rank">{String(i + 1).padStart(2, "0")}</span>
                <span className={`pq-pill ${pillKls}`}>{pillLbl}</span>
                <span className="pq-title">{it.title}</span>
                <span className="pq-source">{it.source}{it.sub ? ` · ${it.sub}` : ""}</span>
                <span className="pq-age">{ageLabel}</span>
                <span className={`pq-due ${isOver ? "over" : ""}`}>
                  {it.due ? relDue(it.due) : (isBlocked ? `blocked · ${it.blockedBy || "—"}` : "—")}
                </span>
              </li>
            );
          })}
        </ol>
      </div>
    </section>
  );
}

/* ─────────────── task editor ─────────────── */

function TaskEditor({ task, onSave, onDelete, onClose, busy }) {
  const [draft, setDraft] = useState({ ...task, tags: task.tags || [] });
  const tagOptions = task.kind === "work" ? WORK_TAGS : [];

  function toggleTag(t) {
    setDraft(d => ({ ...d, tags: d.tags.includes(t) ? d.tags.filter(x => x !== t) : [...d.tags, t] }));
  }

  const ageLabel = task.createdAt
    ? `Added ${relAgo(task.createdAt)} · ${fmtDate(task.createdAt)}`
    : "";

  return (
    <div className="editor">
      <div className="ed-row">
        <label className="ed-label">Title</label>
        <input className="ed-input" value={draft.title} onChange={e => setDraft({ ...draft, title: e.target.value })} />
      </div>

      <div className="ed-grid">
        <div className="ed-row">
          <label className="ed-label">Priority</label>
          <div className="seg">
            {["high","med","low"].map(p => (
              <button key={p} type="button" className={`seg-btn ${draft.pri === p ? "active" : ""}`}
                onClick={() => setDraft({ ...draft, pri: p })}>
                {p[0].toUpperCase() + p.slice(1)}
              </button>
            ))}
          </div>
        </div>
        <div className="ed-row">
          <label className="ed-label">Due</label>
          <input type="date" className="ed-input" value={draft.due || ""}
            onChange={e => setDraft({ ...draft, due: e.target.value || null })} />
        </div>
      </div>

      {task.kind === "work" && (
        <div className="ed-row">
          <label className="ed-label">Tags</label>
          <div className="tag-picker">
            {tagOptions.map(t => (
              <button key={t} type="button" className={`tag-btn ${draft.tags.includes(t) ? "on" : ""}`}
                onClick={() => toggleTag(t)}>{t}</button>
            ))}
          </div>
        </div>
      )}

      {task.kind === "work" && (
        <div className="ed-row">
          <label className="ed-label">Blocked</label>
          <div className="seg">
            <button type="button" className={`seg-btn ${!draft.blocked ? "active" : ""}`}
              onClick={() => setDraft({ ...draft, blocked: false, blockedBy: "" })}>No</button>
            <button type="button" className={`seg-btn ${draft.blocked ? "active" : ""}`}
              onClick={() => setDraft({ ...draft, blocked: true })}>Blocked</button>
            {draft.blocked && (
              <input className="ed-input inline" placeholder="Waiting on…"
                value={draft.blockedBy || ""} onChange={e => setDraft({ ...draft, blockedBy: e.target.value })} />
            )}
          </div>
        </div>
      )}

      <div className="ed-row">
        <label className="ed-label">Note</label>
        <textarea className="ed-input" rows={2} value={draft.note || ""}
          onChange={e => setDraft({ ...draft, note: e.target.value })} placeholder="A line of context…" />
      </div>

      {ageLabel && <div className="ed-meta">{ageLabel}</div>}

      <div className="ed-actions">
        <button type="button" className="ghost danger" onClick={onDelete} disabled={busy}><IconTrash /> Delete</button>
        <div className="spacer" />
        <button type="button" className="ghost" onClick={onClose} disabled={busy}>Cancel</button>
        <button type="button" className="btn-ink" onClick={() => onSave(draft)} disabled={busy}>
          {busy ? "Saving…" : "Save"}
        </button>
      </div>
    </div>
  );
}

/* ─────────────── task row ─────────────── */

function TaskRow({ task, isOpen, onToggle, onCheck, onSave, onDelete, onClose, flash, saveBusy }) {
  const d      = daysFrom(task.due);
  const isOver = d !== null && d < 0 && !task.done;
  const isSoon = d !== null && d >= 0 && d <= 2 && !task.done;
  const age    = task.createdAt ? relAgo(task.createdAt) : null;

  return (
    <li className={`task ${task.done ? "done" : ""} ${flash ? "flash" : ""} ${isOpen ? "open" : ""}`}>
      <div className="task-main" onClick={onToggle}>
        <Check on={task.done} onClick={onCheck} ariaLabel={`Mark "${task.title}" ${task.done ? "incomplete" : "complete"}`} />
        <div className="task-body">
          <div className="task-title">
            {task.title}
            {task.blocked && <span className="inline-pill" title={`Blocked · ${task.blockedBy || ""}`}>blocked</span>}
          </div>
          <div className="task-sub">
            {task.note && <span className="note-snip">{task.note}</span>}
            {task.tags && task.tags.map(t => <span key={t} className="tag">{t}</span>)}
            {age && !task.done && <span className="age-snip">{age}</span>}
          </div>
        </div>
        <span className={`pri ${task.pri}`}>{task.pri === "high" ? "High" : task.pri === "med" ? "Med" : "Low"}</span>
        <span className={`due ${isOver ? "over" : (isSoon ? "soon" : "")}`}>{task.due ? relDue(task.due) : "—"}</span>
        {/* The row div stays clickable for pointer users, but the keyboard and
            screen-reader path is this button — a div with onClick was reachable
            by neither, and the row cannot itself be a button because it already
            contains one (the checkbox). */}
        <button className="task-chev" aria-expanded={isOpen}
          aria-label={`${isOpen ? "Hide" : "Show"} details for "${task.title}"`}
          onClick={(e) => { e.stopPropagation(); onToggle(); }}>
          <IconChev style={{ transform: isOpen ? "rotate(180deg)" : "none", transition: "transform .2s" }} />
        </button>
      </div>
      {isOpen && (
        <TaskEditor task={task} onSave={onSave} onDelete={onDelete} onClose={onClose} busy={saveBusy} />
      )}
    </li>
  );
}

/* ─────────────── task column ─────────────── */

function TaskCol({ title, kind, tasks, openId, setOpenId, onToggle, onSave, onDelete, flashId, saveBusy }) {
  const isWork  = kind === "work";
  const filters = isWork ? ["all","high","tech-viz","pipeline","vendor","bug"] : ["all","high","med","low"];
  const [filter, setFilter] = useState("all");
  const [showDone, setShowDone] = useState(false);

  function match(t) {
    if (filter === "all") return true;
    if (["high","med","low"].includes(filter)) return t.pri === filter;
    return (t.tags || []).includes(filter);
  }
  const visible   = tasks.filter(match);
  const openTasks = visible.filter(t => !t.done);
  const doneTasks = visible.filter(t => t.done);
  const open      = tasks.filter(t => !t.done).length;

  const renderRow = (t) => (
    <TaskRow
      key={t.id} task={t}
      isOpen={openId === t.id}
      onToggle={() => setOpenId(openId === t.id ? null : t.id)}
      onCheck={() => onToggle(t.id)}
      onSave={(draft) => onSave(draft)}
      onDelete={() => onDelete(t.id)}
      onClose={() => setOpenId(null)}
      flash={flashId === t.id}
      saveBusy={saveBusy === t.id}
    />
  );

  return (
    <div className="card task-col">
      <div className="task-col-head">
        <h3>{title}</h3>
        <span className="col-meta">{open} open · {tasks.length - open} done</span>
      </div>
      <div className={`filter-chips ${isWork ? "scroll" : ""}`}>
        {filters.map(f => (
          <button key={f} className={`chip ${filter === f ? "active" : ""}`} onClick={() => setFilter(f)}>
            {f === "all" ? "All" : f === "high" ? "High" : f === "med" ? "Med" : f === "low" ? "Low" : f}
          </button>
        ))}
      </div>
      <ul className="task-list">
        {openTasks.length === 0 && <li className="task empty-row">Beautifully empty.</li>}
        {openTasks.map(renderRow)}
      </ul>
      {doneTasks.length > 0 && (
        <div className="done-bin">
          <button className="done-bin-toggle" onClick={() => setShowDone(s => !s)}>
            <span>Completed</span>
            <span className="done-bin-count">{doneTasks.length}</span>
            <IconChev className="chev" style={{ transform: showDone ? "rotate(180deg)" : "none", transition: "transform .2s" }} />
          </button>
          {showDone && (
            <ul className="task-list">
              {doneTasks.map(renderRow)}
            </ul>
          )}
        </div>
      )}
    </div>
  );
}

/* ─────────────── today panels ─────────────── */

/* The user is in Australia/Sydney and the work calendar's times come from the
   phone as UTC timestamps, so formatting is pinned to that zone rather than the
   browser's — a Mac travelling would otherwise silently shift meeting times. */
const TZ = "Australia/Sydney";

function fmtEventTime(iso) {
  return new Intl.DateTimeFormat("en-AU", {
    hour: "numeric", minute: "2-digit", hour12: true, timeZone: TZ,
  }).format(new Date(iso)).replace(/\s?(am|pm)/i, m => m.trim().toLowerCase());
}

/* Midnight in Australia/Sydney, returned as a UTC instant so it can be compared
   against the timestamptz column directly. dayOffset 0 opens today's window and
   1 closes it.

   The offset has to be the one in force at midnight, and there is no direct way
   to ask for that — Intl reports the offset at an *instant*, and the instant is
   what we are trying to find. So: seed from midday, then re-read the offset at
   the instant that produced and rebuild. On the two changeover days the seed is
   an hour out and the second pass corrects it; on every other day the offset is
   the same at both times and the pass is a no-op. Getting this wrong costs the
   first or last hour of the day twice a year, which is exactly the kind of
   silent wrong-day this panel is supposed to make impossible.
   Source: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/DateTimeFormat/DateTimeFormat#timezonename */
function sydneyMidnightUTC(dayOffset = 0) {
  const ymd = new Intl.DateTimeFormat("en-CA", {
    timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
  }).format(new Date(Date.now() + dayOffset * 864e5));

  const offsetAt = (instant) => {
    const gmt = new Intl.DateTimeFormat("en-AU", {
      timeZone: TZ, timeZoneName: "longOffset",
    }).formatToParts(instant).find(part => part.type === "timeZoneName").value;
    return gmt.replace("GMT", "") || "+00:00";
  };

  const seed = new Date(`${ymd}T00:00:00${offsetAt(new Date(`${ymd}T12:00:00Z`))}`);
  return new Date(`${ymd}T00:00:00${offsetAt(seed)}`).toISOString();
}

/* Shared shape for "nothing here, and here is why" so a free day, a stale sync
   and a broken connection read as three answers to one question rather than
   three unrelated screens. */
function PanelNote({ icon, title, sub, tone = "" }) {
  return (
    <div className={`panel-note ${tone}`} role="status">
      <span className="panel-note-ico" aria-hidden>{icon}</span>
      <div className="panel-note-body">
        <div className="panel-note-title">{title}</div>
        {sub && <div className="panel-note-sub">{sub}</div>}
      </div>
    </div>
  );
}

function PanelSkeleton({ rows = 3, label }) {
  return (
    <div aria-busy="true" aria-label={label}>
      {Array.from({ length: rows }).map((_, i) => (
        <div className="skel-row" key={i}>
          <div className="skel skel-line" style={{ width: "70%" }} />
          <div className="skel skel-line" style={{ width: `${85 - i * 15}%` }} />
        </div>

}

/* Task 8. The panel's job is that a free day and a failed sync never look alike,
   so staleness is a banner above the list rather than a variant of the empty
   state — it has to be visible whether or not any events came through. */
function CalendarPanel({ status, events = [], staleHours }) {
  const isStale = typeof staleHours === "number" && staleHours >= 8;

  return (
    <section className="card panel" aria-labelledby="cal-h">
      <div className="panel-head">
        <h3 id="cal-h">Today</h3>
        <span className="panel-meta">
          {status === "ready" && events.length > 0 ? `${events.length} event${events.length === 1 ? "" : "s"}` : ""}
        </span>
      </div>

      {status === "loading" && <PanelSkeleton rows={3} label="Loading today's calendar" />}

      {status === "unconfigured" && (
        <PanelNote icon={<IconPlug />} title="Calendar not connected yet"
          sub="The work calendar arrives from the iPhone Shortcut; Google calendars follow after sign-in." />
      )}

      {status === "error" && (
        <PanelNote icon={<IconAlert />} tone="warn" title="Couldn't load the calendar"
          sub="Showing nothing rather than a day that might be wrong." />
      )}

      {status === "ready" && (
        <>
          {isStale && (
            <div className="stale-banner" role="alert">
              <IconAlert aria-hidden />
              <span>Last synced <span className="stale-age">{Math.round(staleHours)}h</span> ago — this may not be today's real schedule.</span>
            </div>
          )}
          {events.length === 0
            ? (isStale
                ? <PanelNote icon={<IconCal />} title="No events received"
                    sub="The sync is stale, so this is not necessarily a free day." />
                : <PanelNote icon={<IconCal />} tone="quiet" title="Nothing scheduled. The day is yours." />)
            : (
              <ul className="ev-list">
                {events.map(ev => (
                  <li className={`ev ${ev.now ? "now" : ""}`} key={ev.id}>
                    <span className={`ev-time ${ev.allDay ? "all-day" : ""}`}>
                      {ev.allDay ? "All day" : fmtEventTime(ev.startsAt)}
                    </span>
                    <span className="ev-body">
                      <span className="ev-title">{ev.title}</span>
                      {ev.location && <span className="ev-loc">{ev.location}</span>}
                    </span>
                    <span className={`ev-src ${ev.source === "work" ? "work" : ""}`}>{ev.source}</span>
                  </li>
                ))}
              </ul>
            )}
        </>
      )}
    </section>
  );
}

/* ── Task 12: inbox ranking (decision D4) ──────────────────────────────────
   Deterministic scoring, no model call. The reason this is a block of pure
   functions rather than logic inside the panel is D4's escape hatch: if the
   heuristic picks badly against a real inbox, rankInbox is the only thing that
   has to be replaced, and the panel never learns the difference.

   Nothing here reads tasks, contacts or the calendar. The spec rules that out
   directly (PLAN.md §2): the people who matter most reach Jordan on iMessage,
   so cross-referencing would fire almost never and cost the ranking its nerve.

   Input is a normalised message, not a Gmail payload — see toInboxMessage. */

const ASK_PHRASES = [
  "can you", "could you", "would you", "are you able",
  "let me know", "thoughts?", "any update", "following up", "circling back",
  "please review", "please confirm", "needs your", "waiting on you",
  "sign off", "approve", "deadline", "by end of", "by friday", "by monday",
];

const NOREPLY = /(^|[.\-_])(no-?reply|do-?not-?reply|notifications?|mailer|automated)([.\-_]|@)/i;

/* Age is the signal most likely to be read backwards, so it is a named curve
   rather than an inline expression. Something that landed twenty minutes ago is
   not "unanswered", it is just new; the pressure builds over the first day,
   holds while it is genuinely outstanding, then decays because a ten-day-old
   thread nobody chased is almost never today's problem. */
function agePoints(hours) {
  if (hours < 2)   return 0;
  if (hours < 24)  return Math.round(20 * (hours - 2) / 22);
  if (hours < 72)  return 20;
  if (hours < 240) return Math.round(20 * (240 - hours) / 168);
  return 0;
}

function fmtAge(hours) {
  if (hours < 1)  return "just now";
  if (hours < 24) return `${Math.round(hours)}h`;
  return `${Math.round(hours / 24)}d`;
}

/* Display names arrive as "Priya Raman" or, often enough, not at all. The
   fallback takes the longest word in the address local part rather than the
   whole thing, because "m.reyes@..." capitalises to "M.reyes" and reads like a
   bug in the middle of a sentence; the longest chunk is the surname often
   enough to be worth it, and is at least always a word. */
function firstName(from) {
  const name = (from.name || "").trim();
  if (name) return name.split(/\s+/)[0];

  const chunks = ((from.email || "").split("@")[0].match(/[a-z]+/gi) || [])
    .sort((a, b) => b.length - a.length);
  if (!chunks.length) return "Someone";
  return chunks[0].charAt(0).toUpperCase() + chunks[0].slice(1).toLowerCase();
}

function isKnownSender(from) {
  const hay = `${from.name || ""} ${from.email || ""}`.toLowerCase();
  return KNOWN_SENDERS.some(entry => entry && hay.includes(entry.toLowerCase()));
}

/* Returns null for anything that should never be a pick, rather than scoring it
   low — an excluded message must not be able to win a quiet inbox on points. */
function scoreMessage(msg, { now, self }) {
  if (msg.isCalendarInvite) return null;
  if (NOREPLY.test(msg.from.email || "")) return null;
  if ((msg.labels || []).some(l => l === "CATEGORY_PROMOTIONS" || l === "CATEGORY_SOCIAL")) return null;

  const hours = (now - new Date(msg.receivedAt).getTime()) / 36e5;
  if (hours < 0) return null;

  const addressed = (list) => (list || []).some(a => a.toLowerCase() === self.toLowerCase());
  const text = `${msg.subject || ""} ${msg.snippet || ""}`.toLowerCase();

  const who = firstName(msg.from);

  /* `info` is deliberately not `points`. The heaviest signal is almost always
     "addressed to you directly", which is true of nearly every message that
     scores well and therefore explains nothing — ranking the reason line by
     score produced the same sentence for both picks. `info` ranks a signal by
     how much it tells you that the other pick would not also say. */
  const signals = [];
  const add = (points, key, info, phrase) => { if (points) signals.push({ points, key, info, phrase }); };

  if (isKnownSender(msg.from))        add(30, "known",  5, `${who} rarely emails`);
  if (addressed(msg.to))              add(40, "direct", 1, "sent straight to you");
  else if (addressed(msg.cc))         add(15, "cc",     2, "you're only cc'd");
  else                                add(-35, "bulk",  0, null);
  if (msg.hasListUnsubscribe)         add(-35, "list",  0, null);
  if ((msg.labels || []).includes("CATEGORY_UPDATES")) add(-25, "updates", 0, null);

  if (/\?/.test(text))                add(25, "question", 4, `${who} asked you a question`);
  else if (ASK_PHRASES.some(pattern => text.includes(pattern)))
                                      add(15, "ask",      4, `${who} needs something from you`);

  if (msg.threadLength > 1)           add(10, "thread",   3, "part of a thread you're in");
  add(agePoints(hours), "age", 0, null);

  return { score: signals.reduce((sum, sig) => sum + sig.points, 0), signals, hours };
}

/* The "why it matters" line: the single most informative signal, plus how long
   it has been waiting. Two clauses, because a third stops being a reason and
   starts being a description. Age is appended rather than ranked — it is the
   thing most likely to differ between two otherwise similar picks, and it only
   earns a mention once a message has survived a full day unanswered.
   This is the other half of the D4 swap point: a model call would replace
   exactly this function and rankInbox's use of it. */
function explainMessage({ signals, hours }) {
  const lead = signals
    .filter(sig => sig.phrase && sig.points > 0)
    .sort((a, b) => b.info - a.info)[0];

  const waited = hours >= 24 ? `unanswered for ${fmtAge(hours)}` : null;
  const parts = [lead && lead.phrase, waited].filter(Boolean);

  if (parts.length === 0) return `Sitting in your inbox for ${fmtAge(hours)}.`;
  const line = parts.join(" — ");
  return line.charAt(0).toUpperCase() + line.slice(1) + ".";
}

/* Top two, highest first. Fewer than two is a real answer, not a failure: the
   panel renders an empty inbox as "nothing needs an answer today". */
function rankInbox(messages, { now = Date.now(), self, limit = 2 } = {}) {
  return (messages || [])
    .map(msg => ({ msg, scored: scoreMessage(msg, { now, self }) }))
    .filter(row => row.scored && row.scored.score > 0)
    .sort((a, b) => b.scored.score - a.scored.score)
    .slice(0, limit)
    .map(({ msg, scored }) => ({
      id: msg.id,
      from: msg.from.name || msg.from.email,
      subject: msg.subject || "(no subject)",
      why: explainMessage(scored),
      age: fmtAge(scored.hours),
      url: `https://mail.google.com/mail/u/0/#inbox/${msg.threadId || msg.id}`,
    }));
}

/* Task 13. Surfaces and explains only — each item taps out to Gmail, nothing is
   read, replied to or stored here (spec §1). No unread count anywhere: the spec
   rejects badges explicitly. */
function EmailPanel({ status, items = [] }) {
  return (
    <section className="card panel" aria-labelledby="mail-h">
      <div className="panel-head">
        <h3 id="mail-h">Worth a look</h3>
        <span className="panel-meta">{status === "ready" && items.length > 0 ? "top 2" : ""}</span>
      </div>

      {status === "loading" && <PanelSkeleton rows={2} label="Loading email triage" />}

      {status === "unconfigured" && (
        <PanelNote icon={<IconPlug />} title="Gmail not connected yet"
          sub="Signing in with Google turns this on." />
      )}

      {status === "error" && (
        <PanelNote icon={<IconAlert />} tone="warn" title="Couldn't reach Gmail"
          sub="Nothing is shown rather than a stale pick." />
      )}

      {status === "ready" && (
        items.length === 0
          ? <PanelNote icon={<IconMail />} tone="quiet" title="Nothing needs an answer today." />
          : (
            <ul className="mail-list">
              {items.map(m => (
                <li key={m.id}>
                  <a className="mail" href={m.url} target="_blank" rel="noopener noreferrer">
                    <span className="mail-top">
                      <span className="mail-from">{m.from}</span>
                      <span className="mail-age">{m.age}</span>
                    </span>
                    <span className="mail-subj">{m.subject}</span>
                    <span className="mail-why">{m.why}</span>
                  </a>
                </li>
              ))}
            </ul>
          )
      )}
    </section>
  );
}

/* ─────────────── today view ─────────────── */

/* ─────────────── research view ─────────────── */

function ResearchView({ research, onSave, onDelete, openId, setOpenId, onAddCapture, saveBusy }) {
  const [filter, setFilter] = useState("all");

    all:      research.length,
    active:   research.filter(r => r.status === "active").length,

  return (

        <div>
          <h1 className="hero">Open <em>research threads</em>.</h1>

      <section className="block">
        <div className="filter-chips wide">

            <button key={f} className={`chip ${filter === f ? "active" : ""}`} onClick={() => setFilter(f)}>
              {f === "all" ? "All" : f[0].toUpperCase() + f.slice(1)}

          )}

            <ResearchCard key={r.id} r={r}
              isOpen={openId === r.id}
