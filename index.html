}

/* ─────────────── dashboard (connected) ─────────────── */

function Dashboard({ db, onSignOut }) {
  const [theme, setTheme]   = useState(() => localStorage.getItem(THEME_KEY) || "dark");
  const [view, setView]     = useState("today");
  const [tasks, setTasks]   = useState([]);
  const [research, setRes]  = useState([]);
  const [loading, setLoad]  = useState(true);
  const [error, setError]   = useState(null);
  const [saveBusy, setSave] = useState(null);
  const [openTaskId, setOpenTaskId]   = useState(null);
  const [openResId,  setOpenResId]    = useState(null);
  const [flashId, setFlash]           = useState(null);
  const [calendar, setCalendar]       = useState({ status: "loading" });

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem(THEME_KEY, theme);
  }, [theme]);

  /* initial load */
  useEffect(() => {
    async function load() {
      setLoad(true);
      try {
        const [{ data: tRows, error: te }, { data: rRows, error: re }] = await Promise.all([
          db.from("tasks").select("*").order("created_at", { ascending: false }),
          db.from("research").select("*").order("created_at", { ascending: false }),
        ]);
        if (te) throw te;
        if (re) throw re;
        setTasks((tRows || []).map(toTask));
        setRes((rRows || []).map(toResearch));
      } catch (ex) {
        setError(ex.message || "Failed to load data.");
      } finally {
        setLoad(false);
      }
    }
    load();
  }, []);

  /* Task 8. Separate from the tasks load on purpose: work_events does not exist
     until docs/work_events.sql is run, and a 404 there must not blank the task
     columns. */
  useEffect(() => {
    async function loadCalendar() {
      const [{ data: rows, error: ee }, { data: fresh, error: fe }] = await Promise.all([
        db.from("work_events")
          .select("*")
          .gte("starts_at", sydneyMidnightUTC(0))
          .lt("starts_at", sydneyMidnightUTC(1))
          .order("starts_at", { ascending: true }),
        db.from("work_events_freshness").select("last_sync").maybeSingle(),
      ]);

      /* PGRST205 is "table not in the schema cache", i.e. the SQL has not been
         run yet. Nothing is broken, so it reports as not-connected rather than
         as an error.
         Source: https://docs.postgrest.org/en/v12/references/errors.html */
      const err = ee || fe;
      if (err) {
        setCalendar({ status: err.code === "PGRST205" ? "unconfigured" : "error" });
        return;
      }

      /* The table exists but has never received a sync: also not-connected. The
         alternative reads as "the day is yours", which is the one lie this panel
         is built to prevent. */
      if (!fresh || !fresh.last_sync) {
        setCalendar({ status: "unconfigured" });
        return;
      }

      setCalendar({
        status: "ready",
        events: (rows || []).map(toWorkEvent),
        staleHours: (Date.now() - new Date(fresh.last_sync).getTime()) / 36e5,
      });
    }
    loadCalendar();
  }, []);

  function flash(id) { setFlash(id); setTimeout(() => setFlash(null), 700); }
  function showErr(msg) { setError(msg); setTimeout(() => setError(null), 5000); }

  /* ── task ops ── */
  async function toggleTaskDone(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    const next = !t.done;
    setTasks(prev => prev.map(x => x.id === id ? { ...x, done: next } : x));
    flash(id);
    const { error } = await db.from("tasks").update({ done: next }).eq("id", id);
    if (error) {
      setTasks(prev => prev.map(x => x.id === id ? { ...x, done: t.done } : x));
      showErr("Could not update task.");
    }
  }

  async function saveTask(draft) {
    setSave(draft.id);
    const payload = {
      title: draft.title, pri: draft.pri, due: draft.due || null,
      done: draft.done, tags: draft.tags, note: draft.note || "",
      blocked: draft.blocked || false, blocked_by: draft.blockedBy || "",
    };
    const { data, error } = await db.from("tasks").update(payload).eq("id", draft.id).select().single();
    setSave(null);
    if (error) { showErr("Could not save task."); return; }
    setTasks(prev => prev.map(t => t.id === draft.id ? toTask(data) : t));
    setOpenTaskId(null);
    flash(draft.id);
  }

  async function deleteTask(id) {
    /* Capture the row and its index before the optimistic filter: a failed
       delete has to put it back where it was, or the only signal is a toast
       the user may not catch, and the task looks gone until a reload. */
    const idx = tasks.findIndex(t => t.id === id);
    if (idx === -1) return;
    const row = tasks[idx];
    setTasks(prev => prev.filter(t => t.id !== id));
    setOpenTaskId(null);
    const { error } = await db.from("tasks").delete().eq("id", id);
    if (error) {
      setTasks(prev => { const next = prev.slice(); next.splice(idx, 0, row); return next; });
      showErr("Could not delete task.");
    }
  }

  async function addItem(bucket, text) {
    if (bucket === "personal" || bucket === "work") {
      const payload = {
        kind: bucket, title: text, pri: "med",
        due: null, done: false, tags: [], note: "", blocked: false, blocked_by: "",
      };
      const { data, error } = await db.from("tasks").insert([payload]).select().single();
      if (error) { showErr("Could not add task."); return; }
      const newTask = toTask(data);
      setTasks(prev => [newTask, ...prev]);
      setOpenTaskId(newTask.id);
      flash(newTask.id);
      setView("today");
    } else if (bucket === "research") {
      const payload = { name: text, status: "active", progress: 5, tags: [], note: "" };
      const { data, error } = await db.from("research").insert([payload]).select().single();
      if (error) { showErr("Could not add research item."); return; }
      const newRes = toResearch(data);
      setRes(prev => [newRes, ...prev]);
      setOpenResId(newRes.id);
      setView("research");
    }
  }

  /* ── research ops ── */
  async function saveResearch(draft) {
    setSave(draft.id);
    const payload = {
      name: draft.name, status: draft.status,
      progress: draft.progress, tags: draft.tags, note: draft.note || "",
      updated_at: new Date().toISOString(),
    };
    const { data, error } = await db.from("research").update(payload).eq("id", draft.id).select().single();
    setSave(null);
    if (error) { showErr("Could not save research."); return; }
    setRes(prev => prev.map(r => r.id === draft.id ? toResearch(data) : r));
    setOpenResId(null);
  }

  async function deleteResearch(id) {
    const idx = research.findIndex(r => r.id === id);
    if (idx === -1) return;
    const row = research[idx];
    setRes(prev => prev.filter(r => r.id !== id));
    setOpenResId(null);
    const { error } = await db.from("research").delete().eq("id", id);
    if (error) {
      setRes(prev => { const next = prev.slice(); next.splice(idx, 0, row); return next; });
      showErr("Could not delete research.");
    }
  }

  /* ── priority queue ── */
  const priorityItems = useMemo(() => {
    const list = [];
    tasks.forEach(t => {
      if (t.done) return;
      const d = daysFrom(t.due);
      const isOver = d !== null && d < 0;
      const isSoon = d !== null && d >= 0 && d <= 3;
      if (t.pri === "high" || isOver || isSoon || t.blocked) {
        list.push({
          id: "T-" + t.id, refId: t.id, kind: "task",
          title: t.title, due: t.blocked ? null : t.due,
          flag: t.blocked ? "blocked" : null,
          blockedBy: t.blockedBy,
          source: t.kind === "personal" ? "Personal" : (t.tags && t.tags[0] ? `Work · ${t.tags[0]}` : "Work"),
          sub: t.pri === "high" ? "High" : "",
          createdAt: t.createdAt,
        });
      }
    });
    research.forEach(r => {
      if (r.status === "stalled") {
        list.push({
          id: "R-" + r.id, kind: "research",
          title: r.name, due: null,
          flag: "blocked", blockedBy: "see notes",
          source: "Research", sub: r.tags[0] || "",
          createdAt: r.createdAt,
        });
      }
    });
    function score(item) {
      const d = daysFrom(item.due);
      if (d !== null && d < 0)  return -100 + d;
      if (d !== null && d <= 2) return d;
      if (item.flag === "blocked") return 50;
      if (item.sub === "High")     return 30;
      return 100;
    }
    return list.sort((a, b) => score(a) - score(b)).slice(0, 6);
  }, [tasks, research]);

  const counts = {
    priority: priorityItems.length,
    tasks:    tasks.filter(t => !t.done).length,
    research: research.filter(r => r.status !== "complete").length,
  };

  /* Gmail still needs Task 9's OAuth client, so the email panel renders
     "not connected" rather than an error — nothing is broken; it is simply not
     built. Wiring it is Tasks 12-13. */
  const emailState = { status: "unconfigured" };

  if (loading) {
    return (
      <div className="loading-screen">
        <div className="spinner" />
        <span style={{ fontFamily: "var(--font-mono)", fontSize: "12px" }}>Loading your workspace…</span>
      </div>
    );
  }

  return (
    <div className="app">
      <Sidebar theme={theme} onToggleTheme={() => setTheme(t => t === "dark" ? "light" : "dark")}
        view={view} setView={setView} counts={counts} onSignOut={onSignOut} />
      <main>
        {view === "today" && (
          <TodayView
            tasks={tasks} onToggle={toggleTaskDone} onSave={saveTask} onDelete={deleteTask}
            openId={openTaskId} setOpenId={setOpenTaskId} flashId={flashId}
            saveBusy={saveBusy} priorityItems={priorityItems} onAddCapture={addItem}
            calendar={calendar} email={emailState}
          />
        )}
        {view === "research" && (
          <ResearchView
            research={research} onSave={saveResearch} onDelete={deleteResearch}
            openId={openResId} setOpenId={setOpenResId} onAddCapture={addItem}
            saveBusy={saveBusy}
          />
        )}
      </main>

      {error && (
        <div className="error-banner" role="alert">
          <IconDisc />
          {error}
          <button className="ghost" style={{padding:"2px 8px"}} onClick={() => setError(null)}>×</button>
        </div>
      )}
    </div>
  );
}

/* ─────────────── auth gate ─────────────── */

function SignIn({ db }) {
  const [email, setEmail]       = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy]         = useState(false);
  const [err, setErr]           = useState(null);

  async function submit(e) {
    e.preventDefault();
    setBusy(true);
    setErr(null);
    /* Source: https://supabase.com/docs/reference/javascript/auth-signinwithpassword
       Supabase deliberately returns one indistinct error for "no such account"
       and "wrong password" to prevent account enumeration, so the message shown
       here stays vague on purpose. */
    const { error } = await db.auth.signInWithPassword({ email, password });
    setBusy(false);
    /* The docs are explicit: "Always use error.code and error.name to identify
       errors, not string matching on error messages."
       Source: https://supabase.com/docs/guides/auth/debugging/error-codes
       AuthRetryableFetchError is not listed on that page; the name was confirmed
       against supabase-js 2.112.3 at runtime. This project's Supabase pauses on
       inactivity, so an unreachable host is a routine case, not an edge one —
       "Failed to fetch" would send you hunting for the wrong problem. Any other
       error falls through to the server's own message. */
    if (error) {
      setErr(error.name === "AuthRetryableFetchError"
        ? "Can't reach Supabase — the project may be paused, or you're offline."
        : (error.message || "Could not sign in."));
    }
    /* On success the onAuthStateChange listener in App swaps this for the dashboard. */
  }

  return (
    <div className="loading-screen">
      <form className="card auth-card" onSubmit={submit}>
        <div>
          <div className="brand-mark">LifeOS<em>.</em></div>
          <div className="brand-sub">Sign in to continue</div>
        </div>
        <label className="ed-label" htmlFor="auth-email">Email</label>
        <input id="auth-email" className="ed-input" type="email" autoComplete="username"
          value={email} onChange={e => setEmail(e.target.value)} required autoFocus />
        <label className="ed-label" htmlFor="auth-password">Password</label>
        <input id="auth-password" className="ed-input" type="password" autoComplete="current-password"
          value={password} onChange={e => setPassword(e.target.value)} required />
        <button className="btn-ink" type="submit" disabled={busy || !email || !password}>
          {busy ? "Signing in…" : "Sign in"}
        </button>
        {err && <div className="auth-err">{err}</div>}
      </form>
    </div>
  );
}

/* ─────────────── root app ─────────────── */

const _db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function App() {
  const [session, setSession]   = useState(null);
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    /* Dashboard owns the theme, but it does not mount until sign-in — without
       this the stored light theme flashes dark behind the sign-in form. */
    document.documentElement.setAttribute("data-theme", localStorage.getItem(THEME_KEY) || "dark");

    let alive = true;
    /* Source: https://supabase.com/docs/reference/javascript/auth-getsession
       Reads the session supabase-js persisted in localStorage. The docs' caution
       about untrusted storage applies to cookie-based server rendering, not to a
       browser-only client like this one. */
    _db.auth.getSession().then(({ data }) => {
      if (!alive) return;
      setSession(data.session);
      setChecking(false);
    });

    /* Source: https://supabase.com/docs/reference/javascript/auth-onauthstatechange
       Registered immediately after createClient, as the docs show. The callback
       is synchronous and only sets state — the docs describe it as "safe to use
       without an async function as callback", and awaiting supabase calls inside
       it is the documented way to get into trouble. */
    const { data: { subscription } } = _db.auth.onAuthStateChange((_event, next) => {
      setSession(next);
      setChecking(false);
    });

    return () => { alive = false; subscription.unsubscribe(); };
  }, []);

  if (checking) return <div className="loading-screen"><div className="spinner" /></div>;
  if (!session) return <SignIn db={_db} />;
  return <Dashboard db={_db} onSignOut={() => _db.auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>
